# APLICACI�N
spring.application.name=springboot
server.port=${PORT:8080}

# BASE DE DATOS NEON - CORREGIDO
# IMPORTANTE: Sin punto y coma, sin espacios después del =
spring.datasource.url=jdbc:postgresql://ep-lucky-math-a8arc8go-pooler.eastus2.azure.neon.tech/neondb?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
spring.datasource.username=neondb_owner
spring.datasource.password=npg_ky7GY5MRcrSx

# Docker Compose: desactivado. Se usa Neon, no el compose.yaml de ejemplo
# (si Docker Desktop no está corriendo, Spring Boot 4 aborta el arranque).
spring.docker.compose.enabled=false

# Configuraciones recomendadas para Neon
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuraci�n de subida de archivos - VERSI�N ALTERNATIVA
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}
spring.servlet.multipart.resolve-lazily=false

# Configuraci�n de Tomcat
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=60000

# Configuraci�n de Spring
spring.http.multipart.max-file-size=15MB
spring.http.multipart.max-request-size=15MB

# Para evitar timeout de conexi�n
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.master.springboot=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc=DEBUG
server.error.include-stacktrace=always
server.error.include-message=always
logging.level.org.springframework.web=DEBUG
