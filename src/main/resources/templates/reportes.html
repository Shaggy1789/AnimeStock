<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reportes')}"></head>

<body data-page="reports">

  <aside th:replace="~{fragments/layout :: sidebar('reports')}"></aside>
  <div th:replace="~{fragments/layout :: scrim}"></div>

  <div class="app">

    <header th:replace="~{fragments/layout :: topbar('Reportes', 'Análisis de tu tienda')}"></header>

    <main class="main" id="main">

      <section class="panel is-active" id="panel-reports" data-panel="reports" aria-labelledby="reportsTitle">
        <div class="panel-head">
          <div>
            <h3 class="panel-head__title" id="reportsTitle">Reportes</h3>
            <p class="panel-head__text">Análisis de tu tienda</p>
          </div>
          <div class="panel-head__actions">
            <button class="btn btn--primary" type="button" id="reportsExport">Exportar CSV</button>
          </div>
        </div>
        <p class="panel-status" id="reportsStatus" role="status" hidden></p>
        <div class="mini-kpi-grid" id="reportsKpis" role="list" aria-label="Resumen del período"></div>
        <article class="card card--table" id="reportsSalesCard">
          <div class="table-scroll">
            <table class="table">
              <caption class="sr-only">Ventas del período</caption>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Comprobante</th>
                  <th>Cliente</th>
                  <th>Productos</th>
                  <th>Método</th>
                  <th>Estado</th>
                  <th class="table__num">Total</th>
                </tr>
              </thead>
              <tbody id="reportsSalesRows"></tbody>
            </table>
          </div>
        </article>
        <div class="empty" id="reportsSalesEmpty" hidden>
          <h4 class="empty__title">Sin datos en este período</h4>
        </div>
      </section>

    </main>
  </div>

  <div th:replace="~{fragments/layout :: checkoutModal}"></div>
  <div th:replace="~{fragments/layout :: receiptModal}"></div>
  <div th:replace="~{fragments/layout :: toasts}"></div>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  <script src="/js/reports.js"></script>

</body>

</html>
